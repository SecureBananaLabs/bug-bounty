name: API benchmark
on:
  pull_request:
    paths: ['apps/api/**', 'benchmarks/**', 'package*.json', '.github/workflows/benchmark.yml']
  push:
    branches: [main]
    paths: ['apps/api/**', 'benchmarks/**', 'package*.json', '.github/workflows/benchmark.yml']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix apps/api --workspaces=false --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run benchmark:test
      - run: npm run benchmark:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-benchmark
          path: benchmarks/results/
          if-no-files-found: warn
