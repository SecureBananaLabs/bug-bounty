name: API benchmark smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark-smoke:
    name: API tests and benchmark smoke (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked API dependencies
        run: npm ci --ignore-scripts --workspace apps/api --include-workspace-root --no-audit --no-fund

      - name: Run API and benchmark tests
        run: npm test

      - name: Measure every API endpoint and enforce thresholds
        run: npm run benchmark:smoke

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmarks/results/latest.json
            benchmarks/results/latest.md
          if-no-files-found: warn
          retention-days: 7
